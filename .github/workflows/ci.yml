# Automatska provera koda na svaki push i Pull Request:
# lint (ESLint), provera tipova (TypeScript), provera formata (Prettier), unit testovi (Vitest)
# i build (Next.js).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm test:unit
      - run: pnpm build

  # Provera baze: pokreće pravi lokalni Supabase (Docker), primenjuje sve
  # migracije i seed.sql, proverava da su generisani TypeScript tipovi ažurni
  # i pušta integracione testove (RLS, RPC funkcije, tabela prelaza statusa).
  db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Pokretanje samo servisa koji su potrebni testovima (baza, Auth, API, Realtime).
      - run: pnpm exec supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,storage-api
      # Adresa i ključevi lokalnog Supabase-a idu u env za sledeće korake.
      - run: pnpm exec supabase status -o env | sed 's/"//g' >> "$GITHUB_ENV"
      # Generisani tipovi moraju odgovarati migracijama (ako ne, pokreni pnpm db:types).
      - run: pnpm db:types
      - name: Provera da je src/types/database.ts ažuran
        run: |
          git status --porcelain src/types/database.ts
          test -z "$(git status --porcelain src/types/database.ts)"
      - name: Sačuvaj generisane tipove (za pregled ako provera iznad padne)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: database-types
          path: src/types/database.ts
      # Unit i integracioni testovi zajedno, uz merenje pokrivenosti koda
      # (izveštaj se čuva kao artefakt „coverage“, za poglavlje o testiranju).
      - run: pnpm test:coverage
      - name: Sačuvaj izveštaj o pokrivenosti
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
      # Demo podaci (scripts/seed-demo.mts): pokreću se dva puta (skripta sme da se
      # ponovi), pa se proverava da je u bazi ceo skup demo zahteva (bez duplikata).
      - name: Demo podaci (pnpm seed:demo)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.API_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SERVICE_ROLE_KEY }}
        run: |
          pnpm seed:demo
          pnpm seed:demo
          count=$(psql "$DB_URL" -tAc "select count(*) from public.tickets where created_by::text like '00000000-0000-4000-8001-%'")
          echo "Demo zahteva u bazi: $count"
          test "$count" -ge 130 && test "$count" -le 200
